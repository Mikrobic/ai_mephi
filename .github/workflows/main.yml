name: Telegram Notification

on:
  push:
    branches: [ main, master ]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check commit message for "Лекция"
        id: check-commit
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if echo "$COMMIT_MSG" | grep -qi "Лекция"; then
            echo "lecture_found=true" >> $GITHUB_OUTPUT
            echo "📚 Найдено слово 'Лекция' в коммите"
          else
            echo "lecture_found=false" >> $GITHUB_OUTPUT
            echo "❌ Слово 'Лекция' не найдено в коммите"
          fi

      - name: Send Telegram notification
        if: steps.check-commit.outputs.lecture_found == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_SUPERGROUP_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            📚 Новая лекция загружена!
            
            📦 Репозиторий: ${{ github.repository }}
            🌿 Ветка: ${{ github.ref }}
            👤 Автор: ${{ github.actor }}
            💬 Коммит: ${{ github.event.head_commit.message }}
            🔗 Ссылка: ${{ github.event.head_commit.url }}
            
            #лекция #обновление
