name: Telegram Notification

on:
  push:
    branches: [ main, master ]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check commit message for keywords
        id: check-commit
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          LECTURE_FOUND=false
          MATERIAL_FOUND=false
          
          if echo "$COMMIT_MSG" | grep -qi "Лекция"; then
            LECTURE_FOUND=true
            echo "📚 Найдено слово 'Лекция' в коммите"
          fi
          
          if echo "$COMMIT_MSG" | grep -qi "материал"; then
            MATERIAL_FOUND=true
            echo "📄 Найдено слово 'материал' в коммите"
          fi
          
          if [ "$LECTURE_FOUND" = true ]; then
            echo "notification_type=lecture" >> $GITHUB_OUTPUT
          elif [ "$MATERIAL_FOUND" = true ]; then
            echo "notification_type=material" >> $GITHUB_OUTPUT
          else
            echo "notification_type=none" >> $GITHUB_OUTPUT
            echo "❌ Ключевые слова не найдены в коммите"
          fi

      - name: Send Telegram notification for lecture
        if: steps.check-commit.outputs.notification_type == 'lecture'
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -H "Content-Type: application/json" \
          -d '{
            "chat_id": "${{ secrets.TELEGRAM_SUPERGROUP_CHAT_ID }}",
            "message_thread_id": "${{ secrets.THREAD_ID }}",
            "text": "📚 Новая лекция загружена!\n\n📦 Репозиторий: ${{ github.repository }}\n💬 Коммит: ${{ github.event.head_commit.message }}\n🔗 Ссылка: https://mikrobic.github.io/ai_mephi/lectures/\n\n#лекция #обновление",
            "parse_mode": "HTML"
          }'

      - name: Send Telegram notification for material
        if: steps.check-commit.outputs.notification_type == 'material'
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -H "Content-Type: application/json" \
          -d '{
            "chat_id": "${{ secrets.TELEGRAM_SUPERGROUP_CHAT_ID }}",
            "message_thread_id": "${{ secrets.THREAD_ID }}",
            "text": "📄 Добавлен новый материал!\n\n📦 Репозиторий: ${{ github.repository }}\n🌿 Ветка: ${{ github.ref }}\n👤 Автор: ${{ github.actor }}\n💬 Коммит: ${{ github.event.head_commit.message }}\n🔗 Ссылка: ${{ github.event.head_commit.url }}\n\n#материал #обновление",
            "parse_mode": "HTML"
          }'
